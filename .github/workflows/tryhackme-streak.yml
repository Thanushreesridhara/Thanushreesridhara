name: Update TryHackMe streak

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch streak
        run: python3 scripts/update_tryhackme_streak.py
        continue-on-error: true   # keep last known value on failure
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/tryhackme-streak.json
            git commit -m "chore: update TryHackMe streak"
            git push
          fi
